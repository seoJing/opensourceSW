services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suwon_trip}
      POSTGRES_USER: ${POSTGRES_USER:-suwon_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-suwon_trip}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-suwon_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_password}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
    name: suwon_trip_postgres_data
