name: 작업 계획
description: 초기 구축과 기능 개발의 작업 범위 및 충돌 가능성을 먼저 정리합니다.
title: "[유형]: "
body:
  - type: markdown
    attributes:
      value: |
        제목을 `[유형]: 제목`으로 작성하세요.
        예시 `[Feature]: 상태 카드 추가`
        유형은 Feature, Fix, Refactor, Chore, Docs 중 하나를 사용하세요.
        이슈 번호는 생성할 때 자동으로 붙습니다. 이후 이 번호로 작업 브랜치 하나와 PR 하나를 연결하세요.
  - type: textarea
    id: purpose
    attributes:
      label: 목적과 완료 조건
      description: 한 가지 목적과 눈으로 확인할 수 있는 완료 조건을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 담당자와 수정할 파일·디렉터리
      description: 프론트·백 구분 없이 실제 수정할 경로를 적고, 함께 수정하는 사람을 명시하세요.
    validations:
      required: true
  - type: textarea
    id: coordination
    attributes:
      label: 공통 설정·API 계약·병합 순서
      description: 공통 파일 변경 이유와 영향, 겹치는 작업, 선행 PR을 적으세요. 없으면 해당 없음으로 표시하세요.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 검증 방법
      description: 실행할 테스트와 로컬 Docker 확인 방법을 적어 주세요.
    validations:
      required: true
