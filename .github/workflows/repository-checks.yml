name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-guard:
    name: Repository Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test harness
        run: node --test scripts/repo-harness.test.mjs
      - name: Check repository files
        run: node scripts/repo-harness.mjs
      - name: Check whitespace
        run: git show --format= --check HEAD
