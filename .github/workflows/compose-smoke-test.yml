name: Compose Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    name: Compose Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start services
        run: docker compose up --build -d
      - name: Wait for healthy services
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 180))
          services=(db backend frontend)

          while (( SECONDS < deadline )); do
            all_healthy=true

            for service in "${services[@]}"; do
              container_id=$(docker compose ps --all --quiet "$service")
              if [[ -z "$container_id" ]]; then
                all_healthy=false
                continue
              fi

              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")
              if [[ "$status" != "healthy" ]]; then
                all_healthy=false
              fi
            done

            if [[ "$all_healthy" == "true" ]]; then
              exit 0
            fi

            sleep 2
          done

          echo "Services did not become healthy within 180 seconds." >&2
          exit 1
      - name: Check frontend response
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors http://localhost:3000/ > /dev/null
      - name: Check proxied backend health
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 5 --retry-all-errors http://localhost:3000/api/health)
          echo "$response"
          printf '%s' "$response" | python3 -c 'import json, sys; health = json.load(sys.stdin); assert health["status"] == "UP"; assert health["components"]["db"]["status"] == "UP"'
      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Stop services
        if: always()
        run: docker compose down
