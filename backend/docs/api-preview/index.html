<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>행궁동 카페 · 백엔드 검토</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f6f2; color: #222b26; font: 16px/1.55 system-ui,sans-serif; }
    main { max-width: 800px; margin: 40px auto; padding: 0 20px 40px; }
    h1 { margin: 0; font-size: clamp(26px,5vw,38px); }
    h2 { margin: 0 0 12px; font-size: 21px; }
    section, details { background: white; border: 1px solid #d5d8ce; border-radius: 12px; padding: 20px; margin-top: 16px; }
    fieldset { border: 0; margin: 14px 0; padding: 0; }
    legend { font-weight: 650; }
    label { display: inline-block; padding: 4px 10px 4px 0; }
    input[type=password], button { padding: 8px 12px; font: inherit; border-radius: 6px; }
    button { border: 0; background: #28523d; color: white; cursor: pointer; }
    button:disabled { opacity: .5; }
    summary { cursor: pointer; }
    pre { overflow: auto; background: #f3f5f2; padding: 12px; font-size: 13px; }
    output { display: block; margin: 12px 0; }
    a { color: #28523d; }
  </style>
  <script defer src="/preview.js"></script>
</head>
<body><main>
  <h1>행궁동 카페 추천</h1>
  <p>설문을 저장한 뒤 추천 메뉴와 실제 API 응답을 확인하세요.</p>
  <form id="login">
    <label for="password">시연 계정 fe-demo 비밀번호</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button>로그인</button>
  </form>
  <output id="status" aria-live="polite"></output>
  <section id="survey" hidden>
    <h2>내 취향</h2>
    <form id="form"><div id="questions"></div><button>답변 저장하고 추천받기</button></form>
  </section>
  <section id="result" hidden>
    <h2>추천 메뉴</h2><div id="card"></div><button id="next" type="button">다른 메뉴 보기</button>
  </section>
  <details><summary>API 요청과 응답 보기</summary><div id="history"></div></details>
</main></body>
</html>
